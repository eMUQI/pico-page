<link rel="stylesheet" href="../bundle.css">
<div class="pp-stage" style="padding-block:12px;display:grid;gap:20px">
  <div style="display:grid;gap:20px">
    <div class="pp-choice"><span class="pp-choice__ring"></span><div class="pp-choice__title">清晰</div><div class="pp-choice__desc">每页执行全刷，减少残影</div></div>
    <div class="pp-choice pp-choice--current"><span class="pp-choice__ring"></span><div class="pp-choice__title">均衡</div><div class="pp-choice__desc">灰阶更新，定期全刷</div><span class="pp-tag">当前</span></div>
    <div class="pp-choice"><span class="pp-choice__ring"></span><div class="pp-choice__title">快速</div><div class="pp-choice__desc">优先响应速度，可能更易留痕</div></div>
  </div>
  <div style="border-top:2px solid var(--rule,#cccccc)"></div>
  <div class="pp-choice pp-choice--pending"><span class="pp-choice__ring"></span><div class="pp-choice__title">按文件名轮播</div><div class="pp-choice__desc">每次休眠使用下一张图片</div><span class="pp-tag">待保存</span></div>
</div>
