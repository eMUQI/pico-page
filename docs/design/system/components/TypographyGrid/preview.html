<!-- @dsCard group="控件" height=170 subtitle="参数格与到达上限的步进器" -->
<link rel="stylesheet" href="../bundle.css">
<div class="pp-stage" style="padding-block:24px;display:grid;gap:12px">
  <div class="pp-grid">
    <div class="pp-cell"><span class="pp-cell__name">字体</span><span class="pp-cell__value">霞鹜文楷</span></div>
    <div class="pp-cell"><span class="pp-cell__name">字重</span><span class="pp-cell__value">常规</span></div>
    <div class="pp-cell pp-cell--selected"><span class="pp-cell__name">字号</span><span class="pp-cell__value">56 px</span></div>
    <div class="pp-cell"><span class="pp-cell__name">行距</span><span class="pp-cell__value">1.50</span></div>
    <div class="pp-cell"><span class="pp-cell__name">页边距</span><span class="pp-cell__value">36 px</span></div>
    <div class="pp-cell"><span class="pp-cell__name">段距</span><span class="pp-cell__value">0.00 行</span></div>
    <div class="pp-cell"><span class="pp-cell__name">首行缩进</span><span class="pp-cell__value">2 字</span></div>
    <div class="pp-cell pp-cell--action">恢复默认</div>
  </div>
  <div style="height:72px"></div>
  <div class="pp-stepper"><div class="pp-btn">−</div><div class="pp-stepper__value">56 px</div><div class="pp-btn pp-btn--disabled">+</div></div>
</div>
