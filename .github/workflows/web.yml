name: Website build
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
env:
  # Production deployments: the default branch, a published release, or a manual run on the default branch.
  DEPLOY: ${{ github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}
# Deployments never overlap. Each fetches the firmware when it starts, and only the tip of the
# default branch deploys, so a run that starts later never publishes older content.
concurrency:
  group: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && 'pages-production' || format('web-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # A release run uses the workflow file of its tag, but builds the site from the default
      # branch, so a tag behind the default branch does not publish an older site. Other runs keep
      # the commit that triggered them.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Firmware is not kept in the repository. The site serves the manifest and image attached
      # to the newest release, and a manifest must describe the image beside it.
      - name: Fetch published firmware
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,isDraft > "$RUNNER_TEMP/releases.json"
          tag=$(python3 tools/ota_manifest.py --pick-release "$RUNNER_TEMP/releases.json")
          if [ -n "$tag" ]; then
            gh release download "$tag" --dir web/public/firmware \
              --pattern manifest.json --pattern 'pico-page-*-read_pico-release.bin'
            python3 tools/ota_manifest.py --check web/public/firmware --expect-version "${tag#v}"
          else
            python3 tools/ota_manifest.py --check web/public/firmware
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build website
        run: npm run build
      - name: Upload website artifact
        uses: actions/upload-artifact@v7
        with:
          name: pico-page-web
          path: web/dist/
          if-no-files-found: error
      # Runs of one group are not started in commit order. A run whose commit is no longer the
      # tip of the default branch leaves the deployment to the run of the newer commit.
      - name: Leave deployment to a newer commit
        if: env.DEPLOY == 'true'
        run: |
          git fetch --quiet origin "${{ github.event.repository.default_branch }}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "STALE=true" >> "$GITHUB_ENV"
            echo "::notice::The default branch has moved on; this run does not deploy."
          fi
      # The deployment carries the firmware fetched above: devices install what it publishes.
      # deployment.txt identifies this run, so the check below can tell whether production serves it.
      - name: Deploy to Cloudflare Pages
        if: env.DEPLOY == 'true' && env.STALE != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "$(git rev-parse HEAD) $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" > dist/deployment.txt
          npx --yes wrangler@4.144.0 pages deploy dist --project-name=picopage --branch=main --commit-dirty=true
      - name: Verify the production deployment
        if: env.DEPLOY == 'true' && env.STALE != 'true'
        run: |
          base=https://picopage.wulu.zone
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 8 "$base/deployment.txt" | cmp -s - dist/deployment.txt; then
              if [ -f dist/firmware/manifest.json ]; then
                curl -fsS --max-time 8 "$base/firmware/manifest.json" | cmp -s - dist/firmware/manifest.json && exit 0
              else
                [ "$(curl -s --max-time 8 -o /dev/null -w '%{http_code}' "$base/firmware/manifest.json")" = 404 ] && exit 0
              fi
            fi
            sleep 10
          done
          echo "Production does not serve this deployment" >&2
          exit 1
