name: Website build
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/releases/**'
      - 'tools/ota_manifest.py'
      - 'tools/deploy_firmware.py'
      - 'tools/ci_changes.py'
      - '.github/workflows/web.yml'
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
env:
  # Production deployments: the default branch, a published release, or a manual run on the default branch.
  DEPLOY: ${{ github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}
# Production deployments never overlap. A run yields only to newer website inputs;
# unrelated default-branch changes do not invalidate the site already being built.
concurrency:
  group: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && 'pages-production' || format('web-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      # A release run uses the workflow file of its tag, but builds the site from the default
      # branch, so a tag behind the default branch does not publish an older site. Other runs keep
      # the commit that triggered them.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
          fetch-depth: 0
      - name: Select checks
        id: changes
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci_changes.py --base "$PR_BASE_SHA" | tee -a "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.web == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Firmware is not kept in the repository. The site serves the manifest and the images attached
      # to the newest release: the application image devices download, and the full-flash image of
      # the installer when the release has one. The manifest must describe the application, and
      # the full-flash image must hold the same application.
      - name: Fetch published firmware
        if: steps.changes.outputs.web == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,isDraft > "$RUNNER_TEMP/releases.json"
          tag=$(python3 tools/ota_manifest.py --pick-release "$RUNNER_TEMP/releases.json")
          # The changelog page lists the releases that are public, with their dates.
          mkdir -p web/public/firmware
          gh release list --limit 100 --exclude-drafts --json tagName,publishedAt > web/public/firmware/releases.json
          if [ -n "$tag" ]; then
            gh release download "$tag" --dir web/public/firmware \
              --pattern manifest.json --pattern 'pico-page-*-read_pico-release*.bin'
            python3 tools/ota_manifest.py --check web/public/firmware --expect-version "${tag#v}" \
              --publish-base-url https://oc.wulu.zone/firmware/
          else
            python3 tools/ota_manifest.py --check web/public/firmware
          fi
      - name: Install dependencies
        if: steps.changes.outputs.web == 'true'
        run: npm ci --ignore-scripts
      - name: Build website
        if: steps.changes.outputs.web == 'true'
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID || 'G-S9XSC6V1KV' }}
        run: npm run build
      # Unrelated default-branch commits do not start a replacement website build.
      - name: Leave deployment to newer website inputs
        if: env.DEPLOY == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git fetch --quiet origin "${{ github.event.repository.default_branch }}"
          website_changes=$(python3 tools/ci_changes.py --compare FETCH_HEAD)
          if grep -qx 'web=true' <<< "$website_changes"; then
            echo "STALE=true" >> "$GITHUB_ENV"
            echo "::notice::Website inputs changed on the default branch; a newer run will deploy them."
          fi
      - name: Upload website artifact
        if: env.DEPLOY == 'true' && env.STALE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pico-page-web
          path: web/dist/
          if-no-files-found: error
          retention-days: 3
      - name: Publish firmware to Tencent Cloud
        if: env.DEPLOY == 'true' && env.STALE != 'true'
        working-directory: ${{ github.workspace }}
        env:
          TENCENT_DEPLOY_KEY: ${{ secrets.TENCENT_DEPLOY_KEY }}
          TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
        run: |
          if [ ! -f web/dist/firmware/manifest.json ]; then exit 0; fi
          test -n "$TENCENT_DEPLOY_KEY" && test -n "$TENCENT_KNOWN_HOSTS"
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$TENCENT_DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          (cd web/dist/firmware && tar -cf - manifest.json pico-page-*-read_pico-release*.bin) \
            | ssh -C -F /dev/null -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
                -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
                pico-deploy@oc.wulu.zone publish
      - name: Verify the firmware download origin
        if: env.DEPLOY == 'true' && env.STALE != 'true'
        run: |
          if [ -f dist/firmware/manifest.json ]; then
            for file in dist/firmware/manifest.json dist/firmware/pico-page-*-read_pico-release*.bin; do
              status=$(curl -fsS --proto '=https' --max-time 300 "https://oc.wulu.zone/firmware/${file##*/}" \
                -o "$RUNNER_TEMP/ota-origin.bin" -w '%{http_code}')
              [ "$status" = 200 ]
              cmp "$RUNNER_TEMP/ota-origin.bin" "$file"
            done
          fi
      # The deployment carries the firmware fetched above: devices install what it publishes.
      # deployment.txt identifies this run, so the check below can tell whether production serves it.
      - name: Deploy to Cloudflare Pages
        if: env.DEPLOY == 'true' && env.STALE != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "$(git rev-parse HEAD) $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" > dist/deployment.txt
          npx --yes wrangler@4.144.0 pages deploy dist --project-name=picopage --branch=main --commit-dirty=true
      - name: Verify the production deployment
        if: env.DEPLOY == 'true' && env.STALE != 'true'
        run: |
          base=https://picopage.wulu.zone
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 8 "$base/deployment.txt" | cmp -s - dist/deployment.txt; then
              if [ -f dist/firmware/manifest.json ]; then
                curl -fsS --max-time 8 "$base/firmware/manifest.json" | cmp -s - dist/firmware/manifest.json && exit 0
              else
                [ "$(curl -s --max-time 8 -o /dev/null -w '%{http_code}' "$base/firmware/manifest.json")" = 404 ] && exit 0
              fi
            fi
            sleep 10
          done
          echo "Production does not serve this deployment" >&2
          exit 1
