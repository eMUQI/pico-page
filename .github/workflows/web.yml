name: Website build
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
env:
  # Production deployments: the default branch, a published release, or a manual run on the default branch.
  DEPLOY: ${{ github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}
# Deployments run one after another, so a later run's newer firmware is never replaced by an earlier one.
concurrency:
  group: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && 'pages-production' || format('web-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # A release run uses the workflow file of its tag, but builds the site from the default
      # branch, so a tag behind the default branch does not publish an older site.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Firmware is not kept in the repository. The site serves the manifest and image attached
      # to the newest release, and a manifest must describe the image beside it.
      - name: Fetch published firmware
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,isDraft > "$RUNNER_TEMP/releases.json"
          tag=$(python3 tools/ota_manifest.py --pick-release "$RUNNER_TEMP/releases.json")
          if [ -n "$tag" ]; then
            gh release download "$tag" --dir web/public/firmware \
              --pattern manifest.json --pattern 'pico-page-*-read_pico-release.bin'
            python3 tools/ota_manifest.py --check web/public/firmware --expect-version "${tag#v}"
          else
            python3 tools/ota_manifest.py --check web/public/firmware
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build website
        run: npm run build
      - name: Upload website artifact
        uses: actions/upload-artifact@v7
        with:
          name: pico-page-web
          path: web/dist/
          if-no-files-found: error
      # The deployment carries the firmware fetched above: devices install what it publishes.
      - name: Deploy to Cloudflare Pages
        if: env.DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.144.0 pages deploy dist --project-name=picopage --branch=main --commit-dirty=true
      - name: Verify the published update address
        if: env.DEPLOY == 'true'
        run: |
          url=https://picopage.wulu.zone/firmware/manifest.json
          for attempt in 1 2 3 4 5 6; do
            if [ -f dist/firmware/manifest.json ]; then
              curl -fsS --max-time 8 "$url" | cmp -s - dist/firmware/manifest.json && exit 0
            else
              [ "$(curl -s --max-time 8 -o /dev/null -w '%{http_code}' "$url")" = 404 ] && exit 0
            fi
            sleep 10
          done
          echo "The update address does not match this deployment" >&2
          exit 1
