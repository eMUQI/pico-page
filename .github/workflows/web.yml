name: Website build
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Firmware is not kept in the repository. The site serves the manifest and image attached
      # to the newest release, and a manifest must describe the image beside it.
      - name: Fetch published firmware
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,isDraft > "$RUNNER_TEMP/releases.json"
          tag=$(python3 tools/ota_manifest.py --pick-release "$RUNNER_TEMP/releases.json")
          if [ -n "$tag" ]; then
            gh release download "$tag" --dir web/public/firmware \
              --pattern manifest.json --pattern 'pico-page-*-read_pico-release.bin'
            python3 tools/ota_manifest.py --check web/public/firmware --expect-version "${tag#v}"
          else
            python3 tools/ota_manifest.py --check web/public/firmware
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build website
        run: npm run build
      - name: Upload website artifact
        uses: actions/upload-artifact@v7
        with:
          name: pico-page-web
          path: web/dist/
          if-no-files-found: error
