name: Host checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libssl-dev libcurl4-openssl-dev pkg-config
      - run: python3 tools/setup_fonts.py
      - run: cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/host --parallel 2
      - run: ctest --test-dir build/host --output-on-failure
      - run: python3 tools/check_handoff.py
